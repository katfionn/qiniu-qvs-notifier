services:
  qiniu-qvs-notifier:
    # 默认直接拉取 GitHub Container Registry (GHCR) 自动构建的官方镜像，开箱即用
    image: ghcr.io/katfionn/qiniu-qvs-notifier:latest
    # 如果您修改了本地源码希望从源码重新构建，请注释上面一行并取消下面一行的注释：
    # build: .
    container_name: qiniu-qvs-notifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化配置数据库 (data.db)、日志数据库 (logs.db) 与自动生成的随机密钥 (.secret_key)
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - QVS_DATA_DIR=/app/data
      - PORT=8000
