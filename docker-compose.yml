version: '3.8'

services:
  qiniu-qvs-notifier:
    build: .
    # 如果用户使用拉取现成镜像的方式，可以取消下面这行的注释并修改镜像名
    # image: ghcr.io/katfionn/qiniu-qvs-device-alert-to-dingtalk-bot:latest
    container_name: qiniu-qvs-notifier
    restart: always
    network_mode: bridge
    ports:
      - "8000:8000"
    volumes:
      # 将配置文件和 SQLite 数据库持久化到宿主机当前目录的 config 文件夹下
      - ./config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - QVS_USE_ENV_CONFIG=true
      - QVS_DATA_DIR=/app/data
      - QVS_ADMIN_USERNAME=admin
      - QVS_ADMIN_PASSWORD=admin123456
      - WEB_PORT=8000
