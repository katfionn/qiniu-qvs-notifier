<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置中心 - 监控巡检系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">🛠️ 七牛云设备监控告警 - 配置中心</h1>

        <!-- Settings Section -->
        <div class="bg-white shadow rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">核心参数配置</h2>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Left Column -->
                <div class="space-y-6">
                    <!-- Qiniu Config -->
                    <div>
                        <h3 class="text-lg font-medium text-gray-700 mb-3 bg-gray-100 p-2 rounded">1. 七牛云 API 凭证</h3>
                        <div class="space-y-4 px-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Access Key</label>
                                <input v-model="config.qiniu.access_key" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Secret Key</label>
                                <input v-model="config.qiniu.secret_key" type="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                            </div>
                        </div>
                    </div>

                    <!-- Schedule & Alert Config -->
                    <div>
                        <h3 class="text-lg font-medium text-gray-700 mb-3 bg-gray-100 p-2 rounded">2. 调度与通知策略</h3>
                        <div class="space-y-4 px-2">
                            <div class="flex items-center space-x-4">
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-700">运行模式</label>
                                    <select v-model="config.schedule.mode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2 bg-white">
                                        <option value="loop">持续轮询 (Loop)</option>
                                        <option value="once">执行一次 (Once)</option>
                                    </select>
                                </div>
                                <div class="flex-1" v-if="config.schedule.mode === 'loop'">
                                    <label class="block text-sm font-medium text-gray-700">轮询间隔 (秒)</label>
                                    <input v-model.number="config.schedule.interval_seconds" type="number" min="10" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2">
                                </div>
                            </div>
                            <div>
                                <span class="block text-sm font-medium text-gray-700 mb-2">状态通知触发条件 (状态翻转时生效)</span>
                                <div class="flex space-x-6">
                                    <label class="inline-flex items-center">
                                        <input type="checkbox" v-model="config.alert.notify_offline" class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50">
                                        <span class="ml-2 text-sm text-gray-700">设备下线离线时通知</span>
                                    </label>
                                    <label class="inline-flex items-center">
                                        <input type="checkbox" v-model="config.alert.notify_online" class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50">
                                        <span class="ml-2 text-sm text-gray-700">设备恢复上线时通知</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Webhook Config -->
                <div>
                    <h3 class="text-lg font-medium text-gray-700 mb-3 bg-gray-100 p-2 rounded">3. Webhook 告警配置 (通用)</h3>
                    <div class="space-y-4 px-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Webhook URL</label>
                            <input v-model="config.webhook.url" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder="http://...">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">鉴权方式 (安全设置)</label>
                                <select v-model="config.webhook.auth_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2 bg-white">
                                    <option value="none">无鉴权</option>
                                    <option value="sign">签名 (如钉钉/企微 HMAC-SHA256)</option>
                                    <option value="keyword">关键字验证</option>
                                </select>
                            </div>
                            <div v-if="config.webhook.auth_type === 'sign'">
                                <label class="block text-sm font-medium text-gray-700">Secret (加签密钥)</label>
                                <input v-model="config.webhook.secret" type="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder="SEC...">
                            </div>
                            <div v-if="config.webhook.auth_type === 'keyword'">
                                <label class="block text-sm font-medium text-gray-700">Keyword (关键字)</label>
                                <input v-model="config.webhook.keyword" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder="必须包含的关键字">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">消息文本模板 (变量: <code class="text-blue-500">{device}</code>, <code class="text-blue-500">{state}</code>)</label>
                            <input v-model="config.webhook.template" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2" placeholder="[{device} 设备{state}]">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">
                                自定义 JSON Body
                                <span class="text-xs text-gray-400 font-normal ml-2">变量: {message}, {device}, {state}</span>
                            </label>
                            <textarea v-model="config.webhook.custom_body" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm border p-2 font-mono" placeholder='{"msgtype": "text", "text": {"content": "{message}"}}'></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 border-t pt-4 flex items-center">
                <button @click="saveConfig" class="inline-flex justify-center py-2 px-6 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    保存参数配置
                </button>
                <span v-if="saveStatus" class="ml-4 text-sm font-medium text-green-600 bg-green-50 px-2 py-1 rounded">{{ saveStatus }}</span>
            </div>
        </div>

        <!-- Devices Section -->
        <!-- 同原来一致 -->
        <div class="bg-white shadow rounded-lg p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-semibold">监控设备列表</h2>
                <button @click="showAddModal = true" class="text-sm bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 shadow-sm font-medium">➕ 添加设备</button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">命名空间 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">国标设备 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最近状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr v-for="device in devices" :key="device.id" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ device.id }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ device.namespace_id }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ device.gb_id }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">{{ device.name }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold">
                                <span v-if="device.last_state === 'online'" class="text-green-600 bg-green-100 px-2 py-1 rounded-full text-xs">在线</span>
                                <span v-else-if="device.last_state === 'offline'" class="text-red-600 bg-red-100 px-2 py-1 rounded-full text-xs">离线</span>
                                <span v-else class="text-gray-500 bg-gray-100 px-2 py-1 rounded-full text-xs">未知 ({{ device.last_state }})</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button @click="deleteDevice(device.id)" class="text-red-600 hover:text-red-900 font-semibold">删除</button>
                            </td>
                        </tr>
                        <tr v-if="devices.length === 0">
                            <td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无设备，点击右上角添加。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Device Modal -->
        <div v-if="showAddModal" class="fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" @click="showAddModal = false"></div>
                <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4 border-b pb-2" id="modal-title">添加新监控设备</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">命名空间 ID (Namespace ID)</label>
                                <input v-model="newDevice.namespace_id" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">国标设备 ID (GB ID)</label>
                                <input v-model="newDevice.gb_id" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">设备名称 (备注标识)</label>
                                <input v-model="newDevice.name" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button @click="addDevice" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">确认保存</button>
                        <button @click="showAddModal = false" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const config = ref({
                    qiniu: { access_key: '', secret_key: '' },
                    schedule: { mode: 'loop', interval_seconds: 60 },
                    alert: { notify_online: false, notify_offline: true },
                    webhook: { url: '', auth_type: 'none', secret: '', keyword: '', template: '', custom_body: '' }
                });
                const devices = ref([]);
                const saveStatus = ref('');
                const showAddModal = ref(false);
                const newDevice = ref({ namespace_id: '', gb_id: '', name: '' });

                const fetchConfig = async () => {
                    const res = await fetch('/api/config');
                    const data = await res.json();
                    // Merge to handle missing keys gracefully in UI
                    config.value = { ...config.value, ...data };
                };

                const saveConfig = async () => {
                    try {
                        // Validate JSON body before saving
                        JSON.parse(config.value.webhook.custom_body);
                    } catch (e) {
                        alert("自定义 JSON Body 格式错误，请检查是否是合法的 JSON 字符串！");
                        return;
                    }

                    await fetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config.value)
                    });
                    saveStatus.value = '配置已保存成功！';
                    setTimeout(() => saveStatus.value = '', 3000);
                };

                const fetchDevices = async () => {
                    const res = await fetch('/api/devices');
                    devices.value = await res.json();
                };

                const addDevice = async () => {
                    if (!newDevice.value.namespace_id || !newDevice.value.gb_id || !newDevice.value.name) {
                        alert("请填写完整的设备信息");
                        return;
                    }
                    const res = await fetch('/api/devices', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newDevice.value)
                    });
                    if(res.ok) {
                        showAddModal.value = false;
                        newDevice.value = { namespace_id: '', gb_id: '', name: '' };
                        fetchDevices();
                    } else {
                        alert("添加失败，请确认设备是否已存在。");
                    }
                };

                const deleteDevice = async (id) => {
                    if (confirm("确定要删除该设备吗？此操作不可逆。")) {
                        await fetch(`/api/devices/${id}`, { method: 'DELETE' });
                        fetchDevices();
                    }
                };

                onMounted(() => {
                    fetchConfig();
                    fetchDevices();
                });

                return {
                    config, devices, saveStatus, saveConfig,
                    showAddModal, newDevice, addDevice, deleteDevice
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
